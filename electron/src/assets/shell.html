<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Theme variables — dark default, light via html.light, system fallback via
       prefers-color-scheme. Values track the newtab.html palettes. */
    :root {
      --bar: #181825; --bg: #1e1e2e; --line: #313244;
      --hover: #313244; --hover-strong: #45475a;
      --text-dim: #a6adc8; --text: #cdd6f4; --muted: #6c7086;
      --danger: #f38ba8; --danger-text: #1e1e2e;
    }
    html.light {
      --bar: #eef0f4; --bg: #f5f5f7; --line: #d9dbe3;
      --hover: #e2e4ec; --hover-strong: #cfd2dc;
      --text-dim: #55575f; --text: #1c1d26; --muted: #8b8d97;
      --danger: #dc2626; --danger-text: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      html:not(.dark) {
        --bar: #eef0f4; --bg: #f5f5f7; --line: #d9dbe3;
        --hover: #e2e4ec; --hover-strong: #cfd2dc;
        --text-dim: #55575f; --text: #1c1d26; --muted: #8b8d97;
        --danger: #dc2626; --danger-text: #ffffff;
      }
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    #tab-bar {
      display: flex;
      align-items: center;
      height: 40px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      user-select: none;
      padding: 0 8px;
    }

    #tabs-container {
      display: flex;
      flex: 1;
      overflow-x: auto;
      gap: 2px;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    #tabs-container::-webkit-scrollbar { height: 0; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 30px;
      border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, color 0.15s;
      border: none;
    }

    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.active { background: var(--hover); color: var(--text); }

    .tab-close {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      text-align: center;
      flex-shrink: 0;
    }
    .tab-close:hover { background: var(--hover-strong); color: var(--danger); }
    .tab:hover .tab-close { display: inline-block; }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #new-tab-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    #new-tab-btn:hover { background: var(--hover); color: var(--text); }

    #content {
      flex: 1;
      height: calc(100% - 40px);
      background: var(--bg);
    }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div id="tabs-container">
      <!-- Lives inside the tab strip so it always follows the last open tab -->
      <button id="new-tab-btn" title="新建标签页">+</button>
    </div>
  </div>
  <div id="content"></div>

  <script>
    // Uses the preload-exposed dshDesktop bridge (contextIsolation: true)
    const desktop = window.dshDesktop

    // i18n: titles update based on language config
    const i18n = {
      zh: { newTab: '新建标签页' },
      en: { newTab: 'New Tab' }
    }
    // Apply locale from config (async, fallback to zh)
    desktop.getConfig('language').then((lang) => {
      const s = i18n[lang] || i18n.zh
      document.documentElement.lang = lang || 'zh'
      document.getElementById('new-tab-btn').title = s.newTab
    })

    const tabsContainer = document.getElementById('tabs-container')
    const newTabBtn = document.getElementById('new-tab-btn')

    // Theme sync — variables above cover dark default, html.light and the
    // system media-query fallback; classes below just pick the lane.
    function applyThemePref(pref) {
      const html = document.documentElement
      html.classList.remove('light', 'dark')
      if (pref === 'light') html.classList.add('light')
      else if (pref === 'dark') html.classList.add('dark')
      // 'system' relies on @media prefers-color-scheme
    }
    desktop.getConfig('theme').then(applyThemePref)
    if (desktop.onThemeChanged) desktop.onThemeChanged(applyThemePref)

    // Tab bar rendering
    desktop.onTabsUpdated((tabs) => {
      tabsContainer.innerHTML = ''
      for (const tab of tabs) {
        const el = document.createElement('button')
        el.className = 'tab' + (tab.active ? ' active' : '')
        el.innerHTML = `
          <span class="tab-title">${escapeHtml(tab.title)}</span>
          <span class="tab-close" data-id="${tab.id}">&times;</span>
        `
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) {
            desktop.closeTab(e.target.dataset.id)
          } else {
            desktop.activateTab(tab.id)
          }
        })
        // Middle-click to close
        el.addEventListener('auxclick', (e) => {
          if (e.button === 1) desktop.closeTab(tab.id)
        })
        tabsContainer.appendChild(el)
      }
      // innerHTML wipe removed the button too — re-append it so it always
      // sits right after the last open tab (leftmost when no tabs exist).
      tabsContainer.appendChild(newTabBtn)
    })

    // New tab
    newTabBtn.addEventListener('click', () => {
      desktop.newTab()
    })

    // Keyboard shortcuts (Ctrl+T/W/R, F12) are registered as hidden app-menu
    // accelerators in the main process so they work while BrowserViews hold
    // focus — see registerAcceleratorMenu().

    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text
      return div.innerHTML
    }
  </script>
</body>
</html>
