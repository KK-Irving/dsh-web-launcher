<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>客户端更新</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c14; --surface: #1e1e2e; --border: #313244;
      --text-1: #cdd6f4; --text-2: #a6adc8; --text-3: #6c7086;
      --accent: #4a9eff; --success: #4ade80; --error: #f87171;
    }
    html.light {
      --bg: #f5f5f7; --surface: #ffffff; --border: #d9dbe3;
      --text-1: #1c1d26; --text-2: #55575f; --text-3: #8b8d97;
      --accent: #2563eb; --success: #16a34a; --error: #dc2626;
    }
    @media (prefers-color-scheme: light) {
      html:not(.dark) {
        --bg: #f5f5f7; --surface: #ffffff; --border: #d9dbe3;
        --text-1: #1c1d26; --text-2: #55575f; --text-3: #8b8d97;
        --accent: #2563eb; --success: #16a34a; --error: #dc2626;
      }
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text-1);
      height: 100vh; display: flex; flex-direction: column;
      padding: 18px 22px; -webkit-font-smoothing: antialiased;
      -webkit-app-region: drag; user-select: none;
    }
    .title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: var(--text-3); margin-bottom: 14px; min-height: 16px; }

    .steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .step { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
    .step .n {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      background: var(--border); color: var(--text-2);
      font-size: 11px; display: flex; align-items: center; justify-content: center;
    }
    .step.active .n { background: var(--accent); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
    .step.done .n { background: var(--success); color: #10240f; }
    .step.failed .n { background: var(--error); color: #fff; }
    .step .name { font-size: 12px; color: var(--text-2); flex: 1; }
    .step.active .name, .step.done .name { color: var(--text-1); }
    .step .st { font-size: 11px; color: var(--text-3); }
    .step.active .st { color: var(--accent); }
    .step.done .st { color: var(--success); }
    .step.failed .st { color: var(--error); }
    .step.pending { opacity: 0.55; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

    .bar-wrap { height: 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
    .bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }

    .log-box {
      flex: 1; overflow-y: auto; padding: 8px 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      font-family: Consolas, monospace; font-size: 11px; line-height: 1.5; color: var(--text-2);
      white-space: pre-wrap; word-break: break-all;
      -webkit-app-region: no-drag; min-height: 52px;
    }
    .log-box .err-line { color: var(--error); }
    .log-box .ok-line { color: var(--success); }

    .footer { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; -webkit-app-region: no-drag; }
    .footer button {
      padding: 7px 16px; font-size: 12px; border-radius: 6px;
      border: 1px solid var(--border); cursor: pointer;
      background: var(--surface); color: var(--text-2);
    }
    .footer button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .footer button:hover { opacity: 0.85; }
    .footer button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="title" id="title">客户端更新</div>
  <div class="subtitle" id="subtitle"></div>

  <div class="steps">
    <div class="step" id="step-1"><div class="n">1</div><div class="name" id="name-1">检查 GitHub Releases</div><div class="st" id="st-1"></div></div>
    <div class="step" id="step-2"><div class="n">2</div><div class="name" id="name-2">下载新版本</div><div class="st" id="st-2"></div></div>
    <div class="step" id="step-3"><div class="n">3</div><div class="name" id="name-3">准备安装</div><div class="st" id="st-3"></div></div>
  </div>

  <div class="bar-wrap" id="barWrap" style="display:none"><div class="bar" id="bar"></div></div>
  <div class="log-box" id="logBox"></div>

  <div class="footer">
    <button id="secondaryBtn" style="display:none"></button>
    <button id="primaryBtn" style="display:none"></button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let lang = 'zh';
    let actionArmed = null; // which action the primary button sends

    const T = {
      checking:  { zh: '正在连接 GitHub Releases...', en: 'Connecting to GitHub Releases...' },
      upToDate:  { zh: '检查完成', en: 'Check complete' },
      ready:     { zh: '完成', en: 'Done' },
      failed:    { zh: '失败', en: 'Failed' },
      downloading: { zh: '下载中...', en: 'Downloading...' },
      download:  { zh: '下载', en: 'Download' },
      later:     { zh: '稍后', en: 'Later' },
      close:     { zh: '关闭', en: 'Close' },
      install:   { zh: '立即重启安装', en: 'Restart & Install' }
    };
    function tx(key) { return T[key] ? (T[key][lang] || T[key].zh) : key; }

    function setStep(n, state, stText) {
      const el = document.getElementById('step-' + n);
      el.className = 'step ' + state;
      const icon = el.querySelector('.n');
      if (state === 'done') icon.textContent = '\u2713';
      else if (state === 'failed') icon.textContent = '\u2715';
      else icon.textContent = String(n);
      document.getElementById('st-' + n).textContent = stText || '';
    }

    function log(text, cls) {
      const box = document.getElementById('logBox');
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = text;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function setButtons(items) {
      // items: [{id:'primary'|'secondary', label, action|null(disabled-hidden)}]
      for (const slot of ['primaryBtn', 'secondaryBtn']) {
        const btn = document.getElementById(slot);
        const item = items.find(i => i.slot === slot);
        if (!item) { btn.style.display = 'none'; continue; }
        btn.style.display = '';
        btn.textContent = item.label;
        btn.disabled = false;
        btn.dataset.action = item.action || '';
      }
      actionArmed = null;
    }

    document.getElementById('primaryBtn').addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action) ipcRenderer.send('client-update-action', { action });
    });
    document.getElementById('secondaryBtn').addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action) ipcRenderer.send('client-update-action', { action });
    });

    function clearButtons() { setButtons([]); }

    ipcRenderer.on('client-update-ui', (event, data) => {
      lang = data.lang || 'zh';
      if (data.theme) document.documentElement.classList.toggle('light', data.theme === 'light');

      if (data.subtitle !== undefined) document.getElementById('subtitle').textContent = data.subtitle;
      if (data.log) log(data.log, data.isError ? 'err-line' : (data.isSuccess ? 'ok-line' : ''));
      if (data.clearLog) document.getElementById('logBox').innerHTML = '';

      switch (data.phase) {
        case 'checking':
          clearLogAndSteps();
          setStep(1, 'active', tx('checking'));
          document.getElementById('subtitle').textContent = tx('checking');
          setButtons([]);
          break;

        case 'uptodate':
          setStep(1, 'done', tx('upToDate'));
          log(data.message, 'ok-line');
          setButtons([{ slot: 'primaryBtn', label: tx('close'), action: 'close' }]);
          break;

        case 'found':
          setStep(1, 'done', data.version);
          document.getElementById('subtitle').textContent = data.subtitle || '';
          log(data.message || ('v' + data.version), 'ok-line');
          setStep(2, 'pending');
          setButtons([
            { slot: 'primaryBtn', label: tx('download'), action: 'download' },
            { slot: 'secondaryBtn', label: tx('later'), action: 'skip' }
          ]);
          break;

        case 'downloading':
          setStep(2, 'active', tx('downloading'));
          document.getElementById('barWrap').style.display = '';
          document.getElementById('bar').style.width = (data.percent || 0) + '%';
          if (data.subtitle !== undefined) document.getElementById('subtitle').textContent = data.subtitle;
          setButtons([]);
          break;

        case 'ready':
          setStep(2, 'done', '100%');
          document.getElementById('bar').style.width = '100%';
          setStep(3, 'done', tx('ready'));
          log(data.message, 'ok-line');
          setButtons([{ slot: 'primaryBtn', label: tx('install'), action: 'install' }]);
          break;

        case 'skipped':
          setStep(2, 'pending');
          log(data.message, '');
          setButtons([{ slot: 'primaryBtn', label: tx('close'), action: 'close' }]);
          break;

        case 'error':
          const failedAt = data.failedStep || 1;
          setStep(failedAt, 'failed', tx('failed'));
          log(data.errorMessage || '', 'err-line');
          setButtons([{ slot: 'primaryBtn', label: tx('close'), action: 'close' }]);
          break;
      }
    });

    function clearLogAndSteps() {
      document.getElementById('logBox').innerHTML = '';
      document.getElementById('barWrap').style.display = 'none';
      document.getElementById('bar').style.width = '0%';
      [1, 2, 3].forEach(n => setStep(n, 'pending'));
    }

    // Announce readiness so the main process can replay any phase sent before
    // this page finished loading (the window opens and events fire in parallel).
    ipcRenderer.send('client-update-ready');
  </script>
</body>
</html>
