<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Password Bar</title>
  <style>
    :root { --bg:#23252f; --line:#3a3d4d; --text:#e8eaf2; --sub:#9aa0b5; --btn:#33364a; --btn-hover:#454966; }
    html.light { --bg:#f4f5fa; --line:#d8dbe6; --text:#22242c; --sub:#5d6274; --btn:#e4e6f0; --btn-hover:#d4d7e6; }
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:transparent; overflow:hidden; }
    #bar {
      display:flex; align-items:center; gap:10px;
      height:56px; padding:0 12px;
      background:var(--bg); border:1px solid var(--line); border-radius:10px;
      box-shadow:0 6px 20px rgba(0,0,0,.35);
      color:var(--text); font-size:12px;
    }
    .lock { font-size:16px; }
    .txt { flex:1; min-width:0; }
    #msg { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #site { color:var(--sub); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #acts { display:flex; gap:6px; }
    button {
      background:var(--btn); color:var(--text); border:1px solid var(--line);
      border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; white-space:nowrap;
    }
    button:hover { background:var(--btn-hover); }
    #x { cursor:pointer; color:var(--sub); padding:2px 4px; font-size:13px; }
    #x:hover { color:var(--text); }
  </style>
</head>
<body>
  <div id="bar">
    <span class="lock">&#128273;</span>
    <div class="txt">
      <div id="msg"></div>
      <div id="site"></div>
    </div>
    <div id="acts"></div>
    <span id="x" title="&#10005;">&#10005;</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const acts = document.getElementById('acts');

    function btn(label, action, username) {
      const b = document.createElement('button');
      b.textContent = label;
      b.addEventListener('click', () => ipcRenderer.send('pw-bar-action', { action, username }));
      acts.appendChild(b);
    }

    ipcRenderer.on('pw-bar-ui', (_e, d) => {
      document.documentElement.classList.toggle('light', d.theme === 'light');
      document.getElementById('msg').textContent = d.text || '';
      document.getElementById('site').textContent = (d.site || '').replace(/^https?:\/\//, '');
      acts.textContent = '';
      if (d.mode === 'save') {
        btn(d.labels.save, 'save-confirm');
        btn(d.labels.never, 'never');
      } else if (d.mode === 'fill') {
        (d.users || []).forEach(u => btn(
          d.labels.fill + ' \u00b7 ' + (u || d.labels.unnamed), 'fill', u
        ));
      }
    });

    document.getElementById('x').addEventListener('click', () => {
      ipcRenderer.send('pw-bar-action', { action: 'dismiss' });
    });
  </script>
</body>
</html>
